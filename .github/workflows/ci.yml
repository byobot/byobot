name: CI

# Pull requests and main install the exact versions in python/uv.lock; only one job runs every core driver.
# The nightly run installs the newest dependency versions and runs every core driver everywhere.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.10", drivers: v1}
          - {os: ubuntu-latest, python: "3.11", drivers: v1}
          - {os: ubuntu-latest, python: "3.12", drivers: v1}
          - {os: macos-latest, python: "3.13", drivers: v1}
          - {os: windows-latest, python: "3.13", drivers: v1}
    defaults:
      run:
        working-directory: python
    env:
      BYOBOT_DRIVERS: ${{ matrix.drivers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Install from the lock
        run: uv sync --locked --extra test --python ${{ matrix.python }}
      - name: Test
        run: uv run --locked pytest -q

  latest:
    name: Newest dependencies, Python ${{ matrix.python }} on ${{ matrix.os }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  contract:
    name: Swift types match the contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the generated Swift is up to date
        run: uv run --locked --project python python tools/gen_swift.py --check
      - name: Check the cloud test vectors are up to date
        run: uv run --locked --project python python tools/gen_cloud_vectors.py --check

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build
          python -m build python --outdir dist
      - name: Install the wheel outside the repo and run it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          export BYOBOT_HOME=/tmp/byobot-home
          /tmp/venv/bin/byobot init
          /tmp/venv/bin/byobot validate --as activity '{"name": "Plank"}'
          /tmp/venv/bin/byobot status
          /tmp/venv/bin/byobot devices list
          /tmp/venv/bin/python -c "from byobot.core.contract import Contract; assert Contract.shipped().version('effort')"

  ios:
    name: iPhone app (ByobotKit tests, simulator build)
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: xcodebuild -version && swift --version
      - name: ByobotKit tests (against the shared fixtures)
        working-directory: apps/ios/ByobotKit
        run: swift test
      - name: Generate the Xcode project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build the app for the simulator, unsigned
        working-directory: apps/ios
        run: >
          xcodebuild build
          -project Byobot.xcodeproj
          -scheme Byobot
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
