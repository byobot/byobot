name: CI

# Pull requests and main install the exact versions in python/uv.lock; only one job runs every core driver.
# nightly.yml tests the newest dependency versions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its older run; every other run goes ahead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.10", drivers: v1}
          - {os: ubuntu-latest, python: "3.11", drivers: v1}
          - {os: ubuntu-latest, python: "3.12", drivers: v1}
          - {os: macos-latest, python: "3.13", drivers: v1}
          - {os: windows-latest, python: "3.13", drivers: v1}
    defaults:
      run:
        working-directory: python
    env:
      BYOBOT_DRIVERS: ${{ matrix.drivers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Install from the lock
        run: uv sync --locked --extra test --python ${{ matrix.python }}
      - name: Test
        run: uv run --locked python -m pytest -q

  contract:
    name: Swift types match the contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the generated Swift is up to date
        run: uv run --locked --project python python tools/gen_swift.py --check

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build
          python -m build python --outdir dist
      - name: Install the wheel outside the repo and run it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          export BYOBOT_HOME=/tmp/byobot-home
          /tmp/venv/bin/byobot init
          /tmp/venv/bin/byobot validate activity '{"name": "Plank"}'
          /tmp/venv/bin/byobot status
          /tmp/venv/bin/byobot device list
          /tmp/venv/bin/python -c "from byobot.core.contract import Contract; assert Contract.shipped().version('effort')"

  ios:
    name: iPhone app (ByobotKit tests, simulator build)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: xcodebuild -version && swift --version
      - name: ByobotKit tests (against the shared fixtures)
        working-directory: apps/ios/ByobotKit
        run: swift test
      - name: Generate the Xcode project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build the app for the simulator, unsigned
        working-directory: apps/ios
        run: >
          xcodebuild build
          -project Byobot.xcodeproj
          -scheme Byobot
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
