name: Core soak

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    name: Core stress tests, soak tier
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: python
    env:
      BYOBOT_HYPOTHESIS_PROFILE: soak
      BYOBOT_SOAK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Soak
        run: python -m pytest -q tests/core
      - name: Keep failing examples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-examples
          path: python/.hypothesis
          include-hidden-files: true
