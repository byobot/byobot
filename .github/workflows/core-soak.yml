name: Core soak

# GitHub runs schedules late or drops them under load, so there are two a day.
on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "43 17 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Hypothesis seed (defaults to the run id)
        required: false

concurrency:
  group: core-soak
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  files:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "files=$(cd python && ls tests/core/test_*.py | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  soak:
    name: Soak ${{ matrix.file }}
    needs: files
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.files.outputs.files) }}
    defaults:
      run:
        working-directory: python
    env:
      BYOBOT_HYPOTHESIS_PROFILE: soak
      BYOBOT_SOAK: "1"
      SEED: ${{ inputs.seed || github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[test]" pytest-timeout
      - name: Soak
        run: |
          echo "Hypothesis seed: $SEED"
          python -m pytest -q "${{ matrix.file }}" --hypothesis-seed="$SEED" --timeout=1800
      - name: Keep failing examples
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-examples-${{ strategy.job-index }}
          path: python/.hypothesis
          include-hidden-files: true
          if-no-files-found: ignore
