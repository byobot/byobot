# A throwaway app that logs silent pushes. Generate with `xcodegen generate`.
name: PushProbe
options:
  bundleIdPrefix: io.github.byobot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "27.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
targets:
  PushProbe:
    type: application
    platform: iOS
    sources:
      - path: PushProbe
    settings:
      base:
        # Change to your own reverse-DNS id, and set your team, to run on a phone.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.byobot.pushprobe
        PRODUCT_NAME: PushProbe
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/PushProbe.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  PushProbe:
    build:
      targets:
        PushProbe: all
